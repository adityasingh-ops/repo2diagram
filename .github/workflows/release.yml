name: Release

# Push a version tag like v0.2.1 to publish to PyPI. The moving `v0` tag used by the
# GitHub Action doesn't match, so it never triggers a release.
# One-time setup: on pypi.org add a "trusted publisher" for this repo,
# workflow `release.yml`, environment `pypi` — no API token needed.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync && uv run pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
