[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "repo2diagram"
version = "0.2.1"
description = "Turn any codebase into an interactive architecture diagram. CLI + MCP server. Runs on local models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Aditya Singh" }]
keywords = ["architecture", "diagram", "mermaid", "mcp", "llm", "ollama", "claude", "code-visualization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "httpx>=0.27",
  "pathspec>=0.12",
  "mcp>=1.2",
  "anthropic>=0.40",
]

[project.urls]
Homepage = "https://github.com/adityasingh-ops/repo2diagram"
Issues = "https://github.com/adityasingh-ops/repo2diagram/issues"

[project.scripts]
repo2diagram = "repo2diagram.cli:main"
r2d = "repo2diagram.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/repo2diagram"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
